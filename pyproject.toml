[project]
name = "jobhunt"
version = "0.1.0"
description = "An MCP server and CLI for finding, scoring, and tracking software engineering jobs from ATS boards."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.scripts]
jobhunt = "jobhunt.cli:main"
jobhunt-mcp = "jobhunt.server:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.11", "pre-commit>=3.8"]
pdf = ["markdown>=3.5", "xhtml2pdf>=0.2.15"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobhunt"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: hits real network endpoints; skipped unless selected"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
