name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Same command a contributor runs locally (see AGENTS.md); one source
      # of truth for tool versions instead of a separate pin in this file.
      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy src/jobhunt

      # Only the offline suite: `-m live` hits real ATS endpoints and has no
      # place running unattended on every push.
      - name: Run tests
        run: pytest
